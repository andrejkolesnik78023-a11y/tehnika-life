<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Админка — Техника Лайф</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0d10;
      color: white;
      min-height: 100vh;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px 16px 50px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .title {
      font-size: 25px;
      font-weight: 800;
    }

    .subtitle {
      color: #858b95;
      font-size: 13px;
      margin-top: 4px;
    }

    .card {
      background: #171a20;
      border: 1px solid #252a33;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 16px;
    }

    label {
      display: block;
      color: #aeb4bd;
      font-size: 13px;
      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      background: #0f1216;
      border: 1px solid #2a3039;
      color: white;
      border-radius: 13px;
      padding: 13px;
      font-size: 15px;
      outline: none;
      margin-bottom: 14px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #2b8eea;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .add-button {
      width: 100%;
      background: #2b8eea;
      color: white;
      padding: 15px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      margin-top: 5px;
    }

    .add-button:active {
      transform: scale(.98);
    }

    .products-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .refresh {
      background: #252a33;
      color: white;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
    }

    .product {
      background: #171a20;
      border: 1px solid #252a33;
      border-radius: 17px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .product-top {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .product-icon {
      width: 55px;
      height: 55px;
      background: #22262e;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
    }

    .product-info {
      flex: 1;
      min-width: 0;
    }

    .product-name {
      font-weight: 800;
      font-size: 15px;
    }

    .product-price {
      margin-top: 4px;
      color: #4da3ff;
      font-weight: 800;
    }

    .product-category {
      color: #858b95;
      font-size: 12px;
      margin-top: 3px;
    }

    .product-status {
      margin-top: 10px;
      font-size: 12px;
    }

    .active {
      color: #55d68a;
    }

    .inactive {
      color: #ff6b6b;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .action-button {
      padding: 10px;
      border-radius: 11px;
      color: white;
      font-weight: 700;
    }

    .edit {
      background: #2b8eea;
    }

    .delete {
      background: #d9363e;
    }

    .toggle {
      background: #353b46;
    }

    .cancel {
      background: #353b46;
      color: white;
      padding: 14px;
      border-radius: 13px;
      width: 100%;
      margin-top: 8px;
      font-weight: 700;
      display: none;
    }

    .message {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 20px;
      padding: 14px;
      border-radius: 13px;
      background: #20242c;
      border: 1px solid #343a45;
      text-align: center;
      display: none;
      z-index: 9999;
      font-weight: 700;
    }

    .loading {
      text-align: center;
      color: #858b95;
      padding: 30px;
    }

    @media (max-width: 450px) {
      .row {
        grid-template-columns: 1fr;
        gap: 0;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <div>
      <div class="title">⚡ Техника Лайф</div>
      <div class="subtitle">Панель управления товарами</div>
    </div>
  </div>


  <!-- ДОБАВЛЕНИЕ / РЕДАКТИРОВАНИЕ -->

  <div class="card">

    <div id="formTitle" class="card-title">
      ➕ Добавить товар
    </div>

    <input type="hidden" id="productId">

    <label>Название товара</label>
    <input
      id="name"
      type="text"
      placeholder="Например: iPhone 15 128GB"
    >

    <label>Описание</label>
    <textarea
      id="description"
      placeholder="Описание товара..."
    ></textarea>

    <div class="row">

      <div>
        <label>Цена ₽</label>
        <input
          id="price"
          type="number"
          placeholder="54990"
        >
      </div>

      <div>
        <label>Остаток</label>
        <input
          id="stock"
          type="number"
          placeholder="10"
          value="0"
        >
      </div>

    </div>


    <label>Категория</label>

    <select id="category">

      <option value="Смартфоны">📱 Смартфоны</option>
      <option value="Планшеты">📲 Планшеты</option>
      <option value="Ноутбуки">💻 Ноутбуки</option>
      <option value="Наушники">🎧 Наушники</option>
      <option value="Часы">⌚ Смарт-часы</option>
      <option value="Аксессуары">🔌 Аксессуары</option>

    </select>


    <label>Иконка</label>

    <input
      id="icon"
      type="text"
      placeholder="📱"
      value="📦"
    >


    <label>Ссылка на изображение</label>

    <input
      id="image_url"
      type="text"
      placeholder="https://..."
    >


    <button
      id="saveButton"
      class="add-button"
      onclick="saveProduct()"
    >
      ➕ Добавить товар
    </button>

    <button
      id="cancelButton"
      class="cancel"
      onclick="cancelEdit()"
    >
      Отмена редактирования
    </button>

  </div>


  <!-- СПИСОК ТОВАРОВ -->

  <div class="products-title">

    <div class="card-title" style="margin:0;">
      📦 Товары
    </div>

    <button
      class="refresh"
      onclick="loadProducts()"
    >
      🔄 Обновить
    </button>

  </div>


  <div id="productsList">
    <div class="loading">
      Загрузка товаров...
    </div>
  </div>

</div>


<div id="message" class="message"></div>


<script>

const SUPABASE_URL =
  "https://krdhfzbinbxyketfcrdg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_nDSB-nLt5u2FVp0GH8MffQ_kaJEpB0L";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let editingId = null;


/* УВЕДОМЛЕНИЕ */

function showMessage(text) {

  const message =
    document.getElementById("message");

  message.textContent = text;
  message.style.display = "block";

  setTimeout(() => {
    message.style.display = "none";
  }, 3000);

}


/* ЗАГРУЗКА ТОВАРОВ */

async function loadProducts() {

  const container =
    document.getElementById("productsList");

  container.innerHTML =
    '<div class="loading">Загрузка...</div>';


  const { data, error } =
    await supabaseClient
      .from("products")
      .select("*")
      .order("id", { ascending: false });


  if (error) {

    container.innerHTML =
      `<div class="loading">
        ❌ Ошибка: ${error.message}
      </div>`;

    return;
  }


  if (!data || data.length === 0) {

    container.innerHTML =
      '<div class="loading">Товаров пока нет</div>';

    return;
  }


  container.innerHTML = "";


  data.forEach(product => {

    const item =
      document.createElement("div");

    item.className = "product";


    item.innerHTML = `

      <div class="product-top">

        <div class="product-icon">
          ${product.icon || "📦"}
        </div>

        <div class="product-info">

          <div class="product-name">
            ${escapeHtml(product.name || "Без названия")}
          </div>

          <div class="product-price">
            ${Number(product.price || 0).toLocaleString("ru-RU")} ₽
          </div>

          <div class="product-category">
            ${escapeHtml(product.category || "Без категории")}
          </div>

        </div>

      </div>

      <div class="product-status">

        ${
          product.is_active
          ? '<span class="active">● Товар активен</span>'
          : '<span class="inactive">● Товар скрыт</span>'
        }

        <br>

        📦 Остаток: ${product.stock ?? 0}

      </div>


      <div class="actions">

        <button
          class="action-button edit"
          onclick="editProduct(${product.id})"
        >
          ✏️ Изменить
        </button>

        <button
          class="action-button toggle"
          onclick="toggleProduct(${product.id}, ${product.is_active})"
        >
          ${
            product.is_active
            ? "👁 Скрыть"
            : "👁 Показать"
          }
        </button>

        <button
          class="action-button delete"
          onclick="deleteProduct(${product.id})"
        >
          🗑 Удалить
        </button>

      </div>

    `;


    container.appendChild(item);

  });

}


/* ДОБАВЛЕНИЕ / СОХРАНЕНИЕ */

async function saveProduct() {

  const name =
    document.getElementById("name").value.trim();

  const description =
    document.getElementById("description").value.trim();

  const price =
    Number(document.getElementById("price").value);

  const image_url =
    document.getElementById("image_url").value.trim();

  const category =
    document.getElementById("category").value;

  const icon =
    document.getElementById("icon").value.trim() || "📦";

  const stock =
    Number(document.getElementById("stock").value) || 0;


  if (!name) {

    showMessage("❌ Введите название товара");

    return;
  }


  if (!price || price <= 0) {

    showMessage("❌ Введите правильную цену");

    return;
  }


  const productData = {

    name: name,

    description: description,

    price: price,

    image_url: image_url || null,

    category: category,

    icon: icon,

    stock: stock,

    is_active: true

  };


  let result;


  if (editingId) {

    result =
      await supabaseClient
        .from("products")
        .update(productData)
        .eq("id", editingId);

  } else {

    result =
      await supabaseClient
        .from("products")
        .insert(productData);

  }


  if (result.error) {

    showMessage(
      "❌ Ошибка: " + result.error.message
    );

    console.error(result.error);

    return;
  }


  if (editingId) {

    showMessage("✅ Товар изменён");

  } else {

    showMessage("✅ Товар добавлен");

  }


  cancelEdit();

  await loadProducts();

}


/* РЕДАКТИРОВАНИЕ */

async function editProduct(id) {

  const { data, error } =
    await supabaseClient
      .from("products")
      .select("*")
      .eq("id", id)
      .single();


  if (error) {

    showMessage(
      "❌ Ошибка: " + error.message
    );

    return;
  }


  editingId = id;


  document.getElementById("productId")
    .value = id;

  document.getElementById("name")
    .value = data.name || "";

  document.getElementById("description")
    .value = data.description || "";

  document.getElementById("price")
    .value = data.price || "";

  document.getElementById("image_url")
    .value = data.image_url || "";

  document.getElementById("category")
    .value = data.category || "Смартфоны";

  document.getElementById("icon")
    .value = data.icon || "📦";

  document.getElementById("stock")
    .value = data.stock || 0;


  document.getElementById("formTitle")
    .textContent = "✏️ Редактировать товар";

  document.getElementById("saveButton")
    .textContent = "💾 Сохранить изменения";

  document.getElementById("cancelButton")
    .style.display = "block";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* ОТМЕНА РЕДАКТИРОВАНИЯ */

function cancelEdit() {

  editingId = null;

  document.getElementById("productId")
    .value = "";

  document.getElementById("name")
    .value = "";

  document.getElementById("description")
    .value = "";

  document.getElementById("price")
    .value = "";

  document.getElementById("image_url")
    .value = "";

  document.getElementById("category")
    .value = "Смартфоны";

  document.getElementById("icon")
    .value = "📦";

  document.getElementById("stock")
    .value = "0";


  document.getElementById("formTitle")
    .textContent = "➕ Добавить товар";

  document.getElementById("saveButton")
    .textContent = "➕ Добавить товар";

  document.getElementById("cancelButton")
    .style.display = "none";

}


/* СКРЫТЬ / ПОКАЗАТЬ */

async function toggleProduct(id, currentStatus) {

  const { error } =
    await supabaseClient
      .from("products")
      .update({
        is_active: !currentStatus
      })
      .eq("id", id);


  if (error) {

    showMessage(
      "❌ Ошибка: " + error.message
    );

    return;
  }


  showMessage(
    currentStatus
      ? "👁 Товар скрыт"
      : "👁 Товар снова показан"
  );


  loadProducts();

}


/* УДАЛЕНИЕ */

async function deleteProduct(id) {

  const confirmed =
    confirm(
      "Удалить этот товар без возможности восстановления?"
    );


  if (!confirmed) return;


  const { error } =
    await supabaseClient
      .from("products")
      .delete()
      .eq("id", id);


  if (error) {

    showMessage(
      "❌ Ошибка: " + error.message
    );

    return;
  }


  showMessage("🗑 Товар удалён");

  loadProducts();

}


/* ЗАЩИТА ОТ HTML */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* ЗАПУСК */

loadProducts();

</script>

</body>
</html>
