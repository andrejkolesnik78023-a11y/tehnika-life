<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Техника Лайф</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0d10;
      color: #fff;
      min-height: 100vh;
      padding-bottom: 85px;
    }

    button {
      font-family: inherit;
      border: none;
      cursor: pointer;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 18px 16px;
    }

    /* HEADER */

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
    }

    .logo span {
      color: #4da3ff;
    }

    .cart-top {
      position: relative;
      width: 45px;
      height: 45px;
      border-radius: 14px;
      background: #171a20;
      color: white;
      font-size: 21px;
    }

    .cart-count {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #4da3ff;
      color: white;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 12px;
      display: none;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }

    /* BANNER */

    .banner {
      background: linear-gradient(135deg, #1769aa, #4da3ff);
      border-radius: 24px;
      padding: 25px 20px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .banner-small {
      font-size: 13px;
      opacity: .85;
      margin-bottom: 8px;
    }

    .banner h1 {
      font-size: 28px;
      line-height: 1.1;
      margin-bottom: 8px;
    }

    .banner p {
      font-size: 14px;
      opacity: .9;
    }

    /* SEARCH */

    .search {
      width: 100%;
      background: #171a20;
      border: 1px solid #252a33;
      border-radius: 16px;
      padding: 15px;
      color: white;
      font-size: 15px;
      outline: none;
      margin-bottom: 22px;
    }

    .search::placeholder {
      color: #777d87;
    }

    /* TITLE */

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 22px 0 13px;
    }

    .section-title h2 {
      font-size: 20px;
    }

    /* CATEGORIES */

    .categories {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .category {
      background: #171a20;
      border: 1px solid #242932;
      border-radius: 18px;
      padding: 16px 7px;
      color: white;
      text-align: center;
      transition: .2s;
    }

    .category:active {
      transform: scale(.96);
    }

    .category-icon {
      font-size: 27px;
      margin-bottom: 7px;
    }

    .category-name {
      font-size: 12px;
      font-weight: 600;
    }

    /* PRODUCTS */

    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .product {
      background: #171a20;
      border: 1px solid #242932;
      border-radius: 20px;
      overflow: hidden;
    }

    .product-image {
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #20242c, #111318);
      font-size: 65px;
    }

    .product-info {
      padding: 12px;
    }

    .product-name {
      font-size: 14px;
      font-weight: 600;
      min-height: 38px;
      line-height: 1.3;
    }

    .product-price {
      font-size: 18px;
      font-weight: 800;
      margin: 9px 0;
    }

    .product-button {
      width: 100%;
      background: #2b8eea;
      color: white;
      padding: 11px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
    }

    .product-button:active {
      transform: scale(.97);
    }

    /* BOTTOM NAV */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 72px;
      background: rgba(15,17,21,.96);
      border-top: 1px solid #252932;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .nav-button {
      background: transparent;
      color: #777d87;
      font-size: 12px;
      text-align: center;
    }

    .nav-button.active {
      color: #4da3ff;
    }

    .nav-icon {
      font-size: 22px;
      display: block;
      margin-bottom: 2px;
    }

    /* CART */

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #171a20;
      padding: 12px;
      border-radius: 16px;
      margin-bottom: 10px;
    }

    .cart-item-icon {
      width: 60px;
      height: 60px;
      border-radius: 13px;
      background: #22262e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-name {
      font-size: 14px;
      font-weight: 600;
    }

    .cart-item-price {
      font-size: 15px;
      font-weight: 800;
      margin-top: 5px;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 7px;
    }

    .quantity button {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: #292e37;
      color: white;
    }

    .total-box {
      background: #171a20;
      border-radius: 20px;
      padding: 18px;
      margin-top: 20px;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 14px;
      color: #aeb4bd;
    }

    .total-row:last-child {
      margin-bottom: 0;
      color: white;
      font-size: 21px;
      font-weight: 800;
    }

    .order-button {
      width: 100%;
      background: #2b8eea;
      color: white;
      padding: 16px;
      border-radius: 15px;
      margin-top: 15px;
      font-size: 16px;
      font-weight: 800;
    }

    .empty {
      text-align: center;
      padding: 70px 20px;
      color: #858b95;
    }

    .empty-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    /* PROFILE */

    .profile-card {
      background: #171a20;
      border-radius: 22px;
      padding: 22px;
      text-align: center;
    }

    .profile-icon {
      font-size: 55px;
      margin-bottom: 10px;
    }

    .profile-name {
      font-size: 20px;
      font-weight: 800;
    }

    .profile-text {
      color: #858b95;
      font-size: 14px;
      margin-top: 7px;
    }

    .contact-button {
      display: block;
      width: 100%;
      background: #2b8eea;
      color: white;
      padding: 15px;
      border-radius: 15px;
      margin-top: 20px;
      font-weight: 700;
      text-decoration: none;
    }

    @media (min-width: 550px) {
      .products {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- ГЛАВНАЯ -->
  <div id="homePage" class="page active">

    <div class="header">
      <div class="logo">⚡ Техника <span>Лайф</span></div>

      <button class="cart-top" onclick="openCart()">
        🛒
        <span id="cartCount" class="cart-count">0</span>
      </button>
    </div>

    <div class="banner">
      <div class="banner-small">ОНЛАЙН-МАГАЗИН ТЕХНИКИ</div>
      <h1>Техника для жизни<br>по хорошим ценам</h1>
      <p>Смартфоны, планшеты, гаджеты и аксессуары</p>
    </div>

    <input
      id="searchInput"
      class="search"
      type="text"
      placeholder="🔎 Поиск товара..."
      oninput="searchProducts()"
    >

    <div class="section-title">
      <h2>📂 Категории</h2>
    </div>

    <div class="categories">

      <button class="category" onclick="filterCategory('Смартфоны')">
        <div class="category-icon">📱</div>
        <div class="category-name">Смартфоны</div>
      </button>

      <button class="category" onclick="filterCategory('Планшеты')">
        <div class="category-icon">📲</div>
        <div class="category-name">Планшеты</div>
      </button>

      <button class="category" onclick="filterCategory('Ноутбуки')">
        <div class="category-icon">💻</div>
        <div class="category-name">Ноутбуки</div>
      </button>

      <button class="category" onclick="filterCategory('Наушники')">
        <div class="category-icon">🎧</div>
        <div class="category-name">Наушники</div>
      </button>

      <button class="category" onclick="filterCategory('Часы')">
        <div class="category-icon">⌚</div>
        <div class="category-name">Смарт-часы</div>
      </button>

      <button class="category" onclick="filterCategory('Аксессуары')">
        <div class="category-icon">🔌</div>
        <div class="category-name">Аксессуары</div>
      </button>

    </div>

    <div class="section-title">
      <h2>🔥 Популярное</h2>
    </div>

    <div id="products" class="products"></div>

  </div>


  <!-- КОРЗИНА -->
  <div id="cartPage" class="page">

    <div class="header">
      <div class="logo">🛒 Корзина</div>
    </div>

    <div id="cartItems"></div>

    <div id="cartTotal"></div>

  </div>


  <!-- ПРОФИЛЬ -->
  <div id="profilePage" class="page">

    <div class="header">
      <div class="logo">👤 Профиль</div>
    </div>

    <div class="profile-card">

      <div class="profile-icon">👤</div>

      <div id="profileName" class="profile-name">
        Покупатель
      </div>

      <div class="profile-text">
        Добро пожаловать в Техника Лайф ⚡
      </div>

      <a
        href="https://t.me/kar_y0"
        class="contact-button"
      >
        💬 Связаться с продавцом
      </a>

    </div>

  </div>

</div>


<!-- НИЖНЕЕ МЕНЮ -->

<div class="bottom-nav">

  <button class="nav-button active" onclick="openPage('homePage', this)">
    <span class="nav-icon">🏠</span>
    Главная
  </button>

  <button class="nav-button" onclick="openPage('cartPage', this); renderCart()">
    <span class="nav-icon">🛒</span>
    Корзина
  </button>

  <button class="nav-button" onclick="openPage('profilePage', this)">
    <span class="nav-icon">👤</span>
    Профиль
  </button>

</div>


<script>

  /* TELEGRAM */

  const tg = window.Telegram.WebApp;

  tg.ready();
  tg.expand();


  /* ТОВАРЫ */

  const products = [

    {
      id: 1,
      name: "iPhone 15 128GB",
      price: 54990,
      category: "Смартфоны",
      icon: "📱"
    },

    {
      id: 2,
      name: "Samsung Galaxy S24",
      price: 49990,
      category: "Смартфоны",
      icon: "📱"
    },

    {
      id: 3,
      name: "iPad 10 64GB",
      price: 39990,
      category: "Планшеты",
      icon: "📲"
    },

    {
      id: 4,
      name: "MacBook Air",
      price: 89990,
      category: "Ноутбуки",
      icon: "💻"
    },

    {
      id: 5,
      name: "AirPods Pro 2",
      price: 17990,
      category: "Наушники",
      icon: "🎧"
    },

    {
      id: 6,
      name: "Apple Watch",
      price: 24990,
      category: "Часы",
      icon: "⌚"
    },

    {
      id: 7,
      name: "Зарядка USB-C",
      price: 1490,
      category: "Аксессуары",
      icon: "🔌"
    },

    {
      id: 8,
      name: "Power Bank 20000 mAh",
      price: 2990,
      category: "Аксессуары",
      icon: "🔋"
    }

  ];


  let cart = [];


  /* ПОКАЗ ТОВАРОВ */

  function renderProducts(list = products) {

    const container = document.getElementById("products");

    container.innerHTML = "";

    if (list.length === 0) {

      container.innerHTML = `
        <div class="empty">
          <div class="empty-icon">🔎</div>
          Товар не найден
        </div>
      `;

      return;
    }

    list.forEach(product => {

      container.innerHTML += `

        <div class="product">

          <div class="product-image">
            ${product.icon}
          </div>

          <div class="product-info">

            <div class="product-name">
              ${product.name}
            </div>

            <div class="product-price">
              ${product.price.toLocaleString("ru-RU")} ₽
            </div>

            <button
              class="product-button"
              onclick="addToCart(${product.id})"
            >
              🛒 В корзину
            </button>

          </div>

        </div>

      `;

    });

  }


  /* ДОБАВИТЬ В КОРЗИНУ */

  function addToCart(id) {

    const product = products.find(p => p.id === id);

    const existing = cart.find(p => p.id === id);

    if (existing) {

      existing.quantity++;

    } else {

      cart.push({
        ...product,
        quantity: 1
      });

    }

    updateCartCount();

    tg.HapticFeedback.impactOccurred("light");

  }


  /* КОЛИЧЕСТВО */

  function updateCartCount() {

    const count = cart.reduce(
      (sum, item) => sum + item.quantity,
      0
    );

    const badge = document.getElementById("cartCount");

    badge.textContent = count;

    badge.style.display =
      count > 0 ? "flex" : "none";

  }


  /* КОРЗИНА */

  function renderCart() {

    const container =
      document.getElementById("cartItems");

    const total =
      document.getElementById("cartTotal");

    container.innerHTML = "";

    if (cart.length === 0) {

      container.innerHTML = `
        <div class="empty">
          <div class="empty-icon">🛒</div>
          Корзина пока пустая
          <br><br>
          Добавьте понравившийся товар
        </div>
      `;

      total.innerHTML = "";

      return;

    }


    let sum = 0;


    cart.forEach(item => {

      sum += item.price * item.quantity;

      container.innerHTML += `

        <div class="cart-item">

          <div class="cart-item-icon">
            ${item.icon}
          </div>

          <div class="cart-item-info">

            <div class="cart-item-name">
              ${item.name}
            </div>

            <div class="cart-item-price">
              ${(item.price * item.quantity).toLocaleString("ru-RU")} ₽
            </div>

            <div class="quantity">

              <button onclick="changeQuantity(${item.id}, -1)">
                −
              </button>

              <span>${item.quantity}</span>

              <button onclick="changeQuantity(${item.id}, 1)">
                +
              </button>

            </div>

          </div>

        </div>

      `;

    });


    total.innerHTML = `

      <div class="total-box">

        <div class="total-row">
          <span>Товары</span>
          <span>${sum.toLocaleString("ru-RU")} ₽</span>
        </div>

        <div class="total-row">
          <span>Итого</span>
          <span>${sum.toLocaleString("ru-RU")} ₽</span>
        </div>

        <button
          class="order-button"
          onclick="createOrder()"
        >
          ✅ Оформить заказ
        </button>

      </div>

    `;

  }


  /* ИЗМЕНЕНИЕ КОЛИЧЕСТВА */

  function changeQuantity(id, change) {

    const item = cart.find(p => p.id === id);

    if (!item) return;

    item.quantity += change;

    if (item.quantity <= 0) {

      cart = cart.filter(p => p.id !== id);

    }

    updateCartCount();

    renderCart();

  }


  /* ОФОРМЛЕНИЕ ЗАКАЗА */

  function createOrder() {

    if (cart.length === 0) return;


    let text =
      "🛍 Новый заказ — Техника Лайф%0A%0A";

    let total = 0;


    cart.forEach(item => {

      const itemTotal =
        item.price * item.quantity;

      total += itemTotal;

      text +=
        `📱 ${item.name} × ${item.quantity} — ${itemTotal.toLocaleString("ru-RU")} ₽%0A`;

    });


    text +=
      `%0A💰 Итого: ${total.toLocaleString("ru-RU")} ₽`;

    text +=
      "%0A%0AЗдравствуйте! Хочу оформить этот заказ.";


    tg.showPopup({

      title: "Заказ готов 🎉",

      message:
        "Нажмите «Написать продавцу», чтобы перейти к оплате и подтверждению заказа.",

      buttons: [

        {
          id: "contact",
          type: "default",
          text: "Написать продавцу"
        },

        {
          id: "close",
          type: "cancel",
          text: "Отмена"
        }

      ]

    }, function(buttonId) {

      if (buttonId === "contact") {

        window.location.href =
          "https://t.me/kar_y0?text=" + text;

      }

    });

  }


  /* СТРАНИЦЫ */

  function openPage(pageId, button) {

    document
      .querySelectorAll(".page")
      .forEach(page =>
        page.classList.remove("active")
      );

    document
      .getElementById(pageId)
      .classList.add("active");


    document
      .querySelectorAll(".nav-button")
      .forEach(btn =>
        btn.classList.remove("active")
      );

    button.classList.add("active");

  }


  function openCart() {

    const buttons =
      document.querySelectorAll(".nav-button");

    openPage("cartPage", buttons[1]);

    renderCart();

  }


  /* ПОИСК */

  function searchProducts() {

    const value =
      document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();


    const filtered =
      products.filter(product =>
        product.name
          .toLowerCase()
          .includes(value)
      );


    renderProducts(filtered);

  }


  /* КАТЕГОРИЯ */

  function filterCategory(category) {

    const filtered =
      products.filter(product =>
        product.category === category
      );

    renderProducts(filtered);

    document
      .getElementById("products")
      .scrollIntoView({
        behavior: "smooth"
      });

  }


  /* ПРОФИЛЬ TELEGRAM */

  if (tg.initDataUnsafe &&
      tg.initDataUnsafe.user) {

    const user =
      tg.initDataUnsafe.user;

    document.getElementById("profileName")
      .textContent =
      user.first_name ||
      "Покупатель";

  }


  /* ЗАПУСК */

  renderProducts();

  updateCartCount();

</script>

</body><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://krdhfzbinbxyketfcrdg.supabase.co";
const SUPABASE_KEY = "sb_publishable_nDSB-nLt5u2FVp0GH8MffQ_kaJEpB0L";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
async function loadProducts() {
  const { data, error } = await supabaseClient
    .from("products")
    .select("*")
    .order("id", { ascending: true });

  if (error) {
    console.error("Ошибка Supabase:", error);
    return;
  }

  console.log("Товары из Supabase:", data);

  if (data && data.length > 0) {
    products.length = 0;

    data.forEach(product => {
      products.push({
        id: product.id,
        name: product.name,
        price: product.price,
        category: product.category,
        icon: product.icon || "📦"
      });
    });

    renderProducts();
  }
}

loadProducts();</script>
</html>
